name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main / root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/limkxrby/local-reader-privacy/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "HTTP ${code}"
          cat /tmp/pages.json
          echo
          # 201 created, 409 already enabled
          case "${code}" in
            201|409) exit 0 ;;
            *) exit 1 ;;
          esac
